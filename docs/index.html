<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d5c3a">
  <title>電話番AI</title>
  <style>
    :root {
      --bg: #fdfaf3;
      --text: #1f1f1f;
      --muted: #555;
      --primary: #1d5c3a;
      --primary-active: #c0392b;
      --card: #ffffff;
      --border: #d8d2c4;
      --ai-bg: #e8f3ec;
      --me-bg: #fff4dc;
    }
    * { box-sizing: border-box; }
    html { font-size: 22px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }
    h1 {
      font-size: 1.6rem;
      text-align: center;
      margin: 8px 0 4px;
      color: var(--primary);
    }
    .lead {
      text-align: center;
      margin: 0 0 16px;
      color: var(--muted);
    }
    #log {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .msg {
      padding: 14px 18px;
      border-radius: 16px;
      border: 2px solid var(--border);
      font-size: 1.15rem;
      word-break: break-word;
    }
    .msg .who {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--muted);
    }
    .msg.ai { background: var(--ai-bg); align-self: flex-start; }
    .msg.me { background: var(--me-bg); align-self: flex-end; }
    .msg.interim { opacity: 0.6; }
    .controls {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      border-top: 2px solid var(--border);
      padding: 4px 0 8px;
    }
    #status {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 2em;
      margin: 8px 0;
    }
    #mic {
      display: block;
      width: min(44vw, 28vh, 220px);
      height: min(44vw, 28vh, 220px);
      margin: 0 auto 12px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.25);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #mic .icon { display: block; font-size: 4rem; line-height: 1.2; }
    #mic:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
    #mic.listening {
      background: var(--primary-active);
      animation: pulse 1.2s ease-in-out infinite;
    }
    #mic:disabled { background: #888; cursor: not-allowed; animation: none; }
    #mic:focus-visible { outline: 6px solid #f1c40f; outline-offset: 6px; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
      50% { box-shadow: 0 0 0 24px rgba(192,57,43,0); }
    }
    .error {
      background: #fdecea;
      border: 2px solid #c0392b;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .msg.note {
      background: #fff;
      border-style: dashed;
      align-self: stretch;
      font-size: 1rem;
    }
    .msg.note.urgent { border-color: #c0392b; background: #fdecea; }
    /* 文字で話す欄・合言葉の欄 */
    .text-form, .pass-form {
      display: flex;
      gap: 8px;
      margin: 0 0 8px;
    }
    .text-form label, .pass-form label {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    }
    .text-form input, .pass-form input {
      flex: 1;
      min-width: 0;
      min-height: 60px;
      font-size: 1.1rem;
      padding: 8px 12px;
      border: 2px solid var(--muted);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }
    .text-form button, .pass-form button {
      min-width: 96px;
      min-height: 60px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    .text-form button:disabled { background: #888; cursor: not-allowed; }
    .pass-box {
      background: var(--card);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .pass-box p { margin: 0 0 8px; }
    .sub-label {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 4px;
    }
    footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
<main>
  <h1>☎ 電話番AI</h1>
  <p class="lead">まるいボタンを押して、お話しください</p>

  <div id="unsupported" class="error" hidden>
    このブラウザは音声認識に対応していません。<br>
    スマホは Chrome（Android）や Safari（iPhone）、パソコンは Chrome か Edge でお試しください。
  </div>

  <div id="passBox" class="pass-box" hidden>
    <p>はじめに、合言葉を入れてください。</p>
    <form id="passForm" class="pass-form">
      <label for="passInput">合言葉</label>
      <input id="passInput" type="password" autocomplete="current-password" placeholder="合言葉">
      <button type="submit">決定</button>
    </form>
  </div>

  <section id="log" aria-live="polite"></section>

  <div class="controls">
    <div id="status" role="status">ボタンを押すと、電話番AIがあいさつします</div>
    <button id="mic" type="button" aria-label="話す">
      <span class="icon" aria-hidden="true">🎤</span>
      <span id="micLabel">話す</span>
    </button>
    <p class="sub-label">文字でも話せます（入れて「送る」）</p>
    <form id="textForm" class="text-form">
      <label for="textInput">文字で話す</label>
      <input id="textInput" type="text" enterkeyhint="send" autocomplete="off" placeholder="例：元気よ。今日は畑に行くと">
      <button id="sendBtn" type="submit">送る</button>
    </form>
  </div>

  <footer>
    ハッカソン試作版：お返事は AI（Claude）が作っています。架空の人物の設定で動いています。本当の個人情報は話さないでください。
    <span id="speedInfo"></span>
  </footer>
</main>

<script>
(() => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('mic');
  const micLabel = document.getElementById('micLabel');
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const textForm = document.getElementById('textForm');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const passBox = document.getElementById('passBox');
  const passForm = document.getElementById('passForm');
  const passInput = document.getElementById('passInput');
  const speedInfo = document.getElementById('speedInfo');

  // ---- サーバー（Claude につなぐ窓口）の場所 ----
  // Vercel で開いたときは、同じ場所の /api/chat を使う。
  // GitHub Pages で開いたときは、下の '' に Vercel のアドレス（例：https://denwaban-ai.vercel.app）を入れる。
  const VERCEL_URL_FOR_GITHUB_PAGES = '';
  const API_URL = (location.hostname.endsWith('github.io') ? VERCEL_URL_FOR_GITHUB_PAGES : '') + '/api/chat';

  // サーバーにつながらないときの、予備のあいさつ
  const GREETING = 'おはようございます。電話番AIです。今日の調子はいかがですか？';

  // ---- 通話の状態 ----
  let history = [];      // Claude との会話（サーバーから返ってきたものをそのまま持つ）
  let callDate = '';     // 通話の日付（通話の途中で変えない）
  let callStarted = false;
  let callEnded = false;
  let busy = false;

  // ---- 合言葉（この端末のブラウザにだけ保存）----
  const PASS_KEY = 'denwaban-passcode';
  function loadPasscode() {
    try { return localStorage.getItem(PASS_KEY) || ''; } catch (e) { return ''; }
  }
  function savePasscode(v) {
    try { v ? localStorage.setItem(PASS_KEY, v) : localStorage.removeItem(PASS_KEY); } catch (e) { /* 保存できなくても動く */ }
  }
  let passcode = loadPasscode();
  function showPassBox(message) {
    passBox.hidden = false;
    if (message) passBox.querySelector('p').textContent = message;
    passInput.focus();
  }
  passForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = passInput.value.trim();
    if (!v) return;
    passcode = v;
    savePasscode(v);
    passInput.value = '';
    passBox.hidden = true;
    setStatus('合言葉を入れました。ボタンを押してください');
  });
  if (!passcode) showPassBox();

  let recognition = null;
  let listening = false;
  let gotFinal = false;
  let interimEl = null;
  let jaVoice = null;

  // ---- 表示まわり ----
  function setStatus(text) { statusEl.textContent = text; }

  function addMessage(who, text, extraClass) {
    const div = document.createElement('div');
    div.className = 'msg ' + who + (extraClass ? ' ' + extraClass : '');
    const label = document.createElement('span');
    label.className = 'who';
    label.textContent = who === 'ai' ? '電話番AI' : who === 'note' ? 'お知らせ（デモ）' : 'あなた';
    const body = document.createElement('span');
    body.className = 'text';
    body.textContent = text;
    div.append(label, body);
    logEl.appendChild(div);
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
    return div;
  }

  function setListeningUI(on) {
    listening = on;
    micBtn.classList.toggle('listening', on);
    micLabel.textContent = on ? '聞いています' : '話す';
    micBtn.setAttribute('aria-label', on ? '聞き取りを止める' : '話す');
  }

  // ---- 音声合成 ----
  function pickVoice() {
    const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    jaVoice = voices.find(v => v.lang === 'ja-JP' && /Google|Kyoko|O-ren|Nanami/i.test(v.name))
           || voices.find(v => v.lang && v.lang.replace('_', '-').startsWith('ja'))
           || null;
  }
  if (window.speechSynthesis) {
    pickVoice();
    speechSynthesis.addEventListener?.('voiceschanged', pickVoice);
  }

  function speak(text) {
    return new Promise(resolve => {
      if (!window.speechSynthesis) return resolve();
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      if (jaVoice) u.voice = jaVoice;
      u.rate = 0.85;   // 高齢者向けにゆっくりめ
      u.pitch = 1.0;
      u.volume = 1.0;
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  }

  // iOS Safari はユーザー操作の中で一度 speak しないと後から読み上げできないため、無音で解錠しておく
  let ttsUnlocked = false;
  function unlockTTS() {
    if (ttsUnlocked || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    speechSynthesis.speak(u);
    ttsUnlocked = true;
  }

  // ---- 返事の生成（サーバー経由で Claude に聞く） ----
  // userText が空なら「電話がつながった」として、AI からのあいさつをもらう
  async function makeReply(userText) {
    if (!passcode) {
      const err = new Error('合言葉を入れてください');
      err.needPasscode = true;
      throw err;
    }
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Passcode': encodeURIComponent(passcode) },
        body: JSON.stringify({ messages: history, text: userText || '', callDate }),
      });
    } catch (e) {
      throw new Error('サーバーにつながりませんでした。電波の良いところで、もう一度お試しください');
    }
    let data = {};
    try { data = await res.json(); } catch (e) { /* 中身が読めないときは下で扱う */ }
    if (res.status === 401) {
      const err = new Error(data.error || '合言葉がちがいます');
      err.needPasscode = true;
      throw err;
    }
    if (!res.ok) throw new Error(data.error || ('うまくつながりませんでした（' + res.status + '）'));

    history = data.messages || history;
    callDate = data.callDate || callDate;
    return data;
  }

  function setBusy(on) {
    busy = on;
    micBtn.disabled = on || !SpeechRecognition;
    sendBtn.disabled = on;
  }

  function resetCall() {
    history = [];
    callDate = '';
    callStarted = false;
    callEnded = false;
  }

  // userText を Claude に送って、返事を表示・読み上げる
  async function respond(userText) {
    if (busy) return;
    if (callEnded) resetCall();
    callStarted = true;
    setBusy(true);
    setStatus('考えています…');

    let data;
    try {
      data = await makeReply(userText);
    } catch (e) {
      setBusy(false);
      if (e.needPasscode) {
        passcode = '';
        savePasscode('');
        showPassBox(e.message + '。もう一度入れてください。');
        setStatus('合言葉を入れてから、もう一度お試しください');
      } else {
        setStatus(e.message);
      }
      if (!userText && !history.length) callStarted = false;
      return false;
    }

    (data.notifications || []).forEach(n => {
      const head = n.level === 'urgent' ? '【至急】ご家族に知らせます：' : 'お電話のあと、ご家族に知らせます：';
      addMessage('note', head + '「' + n.quote + '」 ' + n.summary, n.level === 'urgent' ? 'urgent' : '');
    });
    (data.lineResults || []).forEach(r => {
      const head = r.sent
        ? 'LINEでご家族に送りました：'
        : r.reason === 'not_configured'
          ? 'LINEはまだ設定されていないため、送っていません（送る文）：'
          : 'LINEを送れませんでした（送る文）：';
      addMessage('note', head + r.text, r.level === 'urgent' ? 'urgent' : '');
    });
    if (data.model) {
      speedInfo.textContent = '（' + data.model + '・' + (data.elapsedMs / 1000).toFixed(1) + '秒）';
    }

    if (data.reply) {
      addMessage('ai', data.reply);
      setStatus('お返事しています…');
      await speak(data.reply);
    }
    setBusy(false);

    if (data.ended) {
      callEnded = true;
      setStatus('お電話が終わりました。もう一度かけるときは、ボタンを押してください');
    } else {
      setStatus(SpeechRecognition
        ? 'もう一度話すときは、ボタンを押してください'
        : '文字を入れて「送る」を押してください');
    }
    return true;
  }

  // ---- 文字で話す ----
  textForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text || busy) return;
    unlockTTS();
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (listening && recognition) recognition.abort();
    if (callEnded) { resetCall(); logEl.textContent = ''; }
    textInput.value = '';
    const myMsg = addMessage('me', text);
    const ok = await respond(text);
    if (!ok) {
      // 送れなかったときは、入れた文字を欄に戻して、もう一度送れるようにする
      myMsg.remove();
      textInput.value = text;
    }
  });

  // ---- 音声認識 ----
  function setupRecognition() {
    const r = new SpeechRecognition();
    r.lang = 'ja-JP';
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;

    r.onstart = () => {
      gotFinal = false;
      setListeningUI(true);
      setStatus('どうぞ、お話しください');
    };

    r.onresult = (event) => {
      let interim = '';
      let final = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += t; else interim += t;
      }
      if (interim) {
        if (!interimEl) interimEl = addMessage('me', interim, 'interim');
        else interimEl.querySelector('.text').textContent = interim;
      }
      if (final) {
        gotFinal = true;
        if (interimEl) { interimEl.remove(); interimEl = null; }
        addMessage('me', final.trim());
        respond(final.trim());
      }
    };

    r.onerror = (event) => {
      const messages = {
        'no-speech': '声が聞こえませんでした。もう一度ボタンを押してください',
        'audio-capture': 'マイクが見つかりません',
        'not-allowed': 'マイクの使用が許可されていません。ブラウザの設定で許可してください',
        'service-not-allowed': 'マイクの使用が許可されていません。ブラウザの設定で許可してください',
        'network': '通信がうまくいきませんでした。電波の良いところでお試しください',
        'aborted': '聞き取りを止めました'
      };
      setStatus(messages[event.error] || ('うまく聞き取れませんでした（' + event.error + '）'));
    };

    r.onend = () => {
      setListeningUI(false);
      if (interimEl) {
        // 確定結果が来ないまま終わった場合は途中結果を採用する
        const text = interimEl.querySelector('.text').textContent.trim();
        interimEl.remove();
        interimEl = null;
        if (!gotFinal && text) {
          addMessage('me', text);
          respond(text);
        }
      }
    };
    return r;
  }

  // ---- 起動 ----
  if (!SpeechRecognition) {
    // 音声認識が使えなくても、文字で話すことはできる
    document.getElementById('unsupported').hidden = false;
    micBtn.disabled = true;
    setStatus('文字を入れて「送る」を押すと、お話しできます');
    return;
  }

  micBtn.addEventListener('click', async () => {
    unlockTTS();
    if (listening) { recognition && recognition.stop(); return; }
    if (busy) return;

    if (!callStarted || callEnded) {
      // 最初の1回は電話番AIからのあいさつ（毎朝の電話のイメージ）
      if (callEnded) { resetCall(); logEl.textContent = ''; }
      const ok = await respond('');
      if (!ok && passcode) {
        // サーバーにつながらないときは、予備のあいさつだけ読み上げる
        addMessage('ai', GREETING);
        await speak(GREETING);
      }
      if (ok && !callEnded) {
        // iPhone では音声認識の開始にボタン操作が必要なため、ここで一度止めてもう一度押してもらう
        setStatus('ボタンを押して、お返事してください');
      }
      return;
    }

    speechSynthesis.cancel();
    recognition = setupRecognition();
    try {
      recognition.start();
    } catch (e) {
      setStatus('もう一度ボタンを押してください');
    }
  });
})();
</script>
</body>
</html>
